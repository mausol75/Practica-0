# ============================================================
# compose.yaml -- Practica00 (Flask + SQLite)
# ============================================================
# Uso local:
#   docker compose up -d --build
#
# En produccion el runner self-hosted usa compose.runner.yaml
# como override para etiquetar la imagen con el SHA del commit.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practica00-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - SESSION_SECRET_FILE=/run/secrets/session_secret
    secrets:
      - session_secret
    volumes:
      - sqlite_data:/app/sistema/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  session_secret:
    file: .secrets/session_secret

volumes:
  sqlite_data:
